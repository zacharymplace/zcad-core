[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zcad-core"
version = "0.1.1"
description = "Reusable parametric CAD engine"
requires-python = ">=3.11"
dependencies = [
  "cadquery>=2.8,<3",
]

[project.scripts]
zcad-validation = "zcad_core.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=2.3,<3",
  "pytest>=9,<10",
  "ruff>=0.16,<1",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9,<10",
  "mkdocstrings[python]>=0.26,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["zcad_core*"]

[tool.setuptools.package-data]
zcad_core = ["py.typed"]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
  "slow: loads a vendor STEP model from evidence/; deselect with -m 'not slow'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zcad-core"
version = "0.5.0"
description = "Reusable parametric CAD engine"
requires-python = ">=3.11"
dependencies = [
  "cadquery>=2.8,<3",
  # Both come with CadQuery; the silhouette reads them directly.
  "numpy",
  "scipy",
]

[project.scripts]
zcad-validation = "zcad_core.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=2.3,<3",
  "pytest>=9,<10",
  "pytest-timeout>=2,<3",
  "pytest-xdist>=3,<4",
  "ruff>=0.16,<1",
]
docs = [
  # MkDocs 2 drops plugins, so mkdocstrings and Material cannot run on it;
  # stay on 1.x (Material 9.7.5+ enforces the same cap).
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.7.5,<10",
  "mkdocstrings[python]>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["zcad_core*"]

[tool.setuptools.package-data]
zcad_core = [
  "py.typed",
  "hardware/data/board-components/*.json",
  "hardware/data/boards/*.json",
  "features/data/*.html",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Ruff's defaults plus a complexity ceiling; split a function that exceeds it.
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--strict-markers"]
# A test that has not finished in a quarter of an hour has hung; it fails, with a stack, rather
# than holding the gate (and a push's tests) for good. Needs pytest-timeout, in the dev extras.
timeout = 900
markers = [
  "slow: loads a vendor STEP model from evidence/; deselect with -m 'not slow'",
]

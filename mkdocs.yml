site_name: zcad-core
site_description: Reusable parametric CAD engine powering parametric design systems.
docs_dir: docs
repo_name: zcad-core

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture.md
      - Retention strategy evidence: architecture/retention-strategy-evidence.md
      - Figures taken on trust: reference/figures.md
  - Guides:
      - Validation Lab workflow: guides/validation-lab-workflow.md
      - Calibrating a printer: guides/calibration-coupon.md
      - Engine example: guides/engine-example.md
      - Enclosure builder: guides/enclosure-builder.md
      - Your own board: guides/board-file.md
      - A drill guide for your part: guides/drill-guide.md
      - A test fixture for your board: guides/pcb-test-fixture.md
      - Pi 5 group enclosure: guides/pi5-group-enclosure.md
      - Measuring a wearable: guides/wearable-capture.md
      - A housing for something you wear: guides/wearable-housing.md
      - A holding nest for your part: guides/holding-nest.md
      - An insert jig for your part: guides/insert-jig.md
      - Stackable items: guides/stackable-items.md
      - A holder for an object: guides/object-holder.md
  - Roadmaps:
      - Validation Lab: roadmaps/validation-lab.md
      - Next phases: roadmaps/next-phases.md
      - Mounting systems: roadmaps/mounting-systems.md
      - Hinged and sliding lids: roadmaps/hinges-and-slides.md
      - Thermal features: roadmaps/thermal-features.md
      - Generic boards: roadmaps/generic-boards.md
      - Drill guides and fixtures: roadmaps/drill-guides.md
      - PCB test fixtures: roadmaps/pcb-test-fixtures.md
      - Modular bays: roadmaps/modular-bays.md
      - Wearable housings: roadmaps/wearable-housings.md
      - Nests and jigs: roadmaps/nests-and-jigs.md
      - Stackable items: roadmaps/stackable-items.md
      - Stackable latches: roadmaps/stackable-latches.md
      - Stacking on a lid: roadmaps/stack-top.md
      - A drawer stop: roadmaps/drawer-stop.md
      - Importing a KiCad board: roadmaps/kicad-import.md
      - Object holders: roadmaps/object-holders.md
  - API Reference:
      - Overview: reference/index.md
      - assemblies: reference/assemblies.md
      - cli: reference/cli.md
      - exporters: reference/exporters.md
      - features: reference/features.md
      - geometry: reference/geometry.md
      - hardware: reference/hardware.md
      - metadata: reference/metadata.md
      - printing: reference/printing.md
      - profiles: reference/profiles.md
      - retention: reference/retention.md
      - validation: reference/validation.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
